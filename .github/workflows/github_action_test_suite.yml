# Downstream support target only. Upstream retains its own compatibility matrix.
name: test-suite

on:
  push:
    branches: [ur-dev]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [ur-dev]

permissions:
  contents: read

concurrency:
  group: engine-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: evennia
          POSTGRES_USER: evennia
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
        timeout-minutes: 2
      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-database
        with:
          database: postgresql
        timeout-minutes: 5
      - name: Run full engine suite on our supported runtime
        uses: ./.github/actions/run-tests
        with:
          python-version: "3.14.8"
          testing-db: postgresql
          coverage-test: "false"
          needs-postgres-package: "true"
          needs-mysql-package: "false"
