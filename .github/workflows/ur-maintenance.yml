name: Downstream maintenance

on:
  pull_request:
    branches: [ur-dev]
  push:
    branches: [ur-dev]

permissions:
  contents: read

jobs:
  mirror-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test fast-forward-only synchronization
        run: python3 -m unittest discover -s downstream/tests -v
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
          python-version: "3.14.8"
      - name: Build engine without maintenance packages
        run: uv build --wheel --out-dir "$RUNNER_TEMP/evennia-wheel"
      - name: Check wheel contents
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list((Path(os.environ['RUNNER_TEMP']) / 'evennia-wheel').glob('*.whl'))
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert not any(name.startswith('downstream/') for name in names)
          for required in ('evennia/__init__.py', 'evennia/settings_default.py', 'evennia/web/templates/webclient/base.html'):
              assert required in names, required
          PY
      - name: Export locked dependencies including optional features
        run: uv export --locked --all-extras --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/evennia-audit.txt"
      - name: Audit every locked dependency without suppressions
        run: uv tool run --python 3.14.8 --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps --requirement "$RUNNER_TEMP/evennia-audit.txt"
